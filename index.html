<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GreenPixel — Турбориум</title><link rel="stylesheet" href="assets/7ea4bdf9033e/styles.css"></head><body>
<nav id="menubar" aria-label="Главное меню"></nav>
<main id="layout"><aside id="left-panel"><div id="toolbar" aria-label="Инструменты"></div><section id="tool-options"></section></aside>
<section id="center"><div id="tabs" role="tablist"></div><div id="startup"><h1 id="welcome"></h1><p id="choose"></p><button id="recent">Недавние файлы</button><button id="startup-help" title="Справка">?</button><div id="startup-actions"></div><div id="startup-footer"><label><input id="show-startup" type="checkbox" checked> <span id="show-startup-label"></span></label><span>Турбориум GreenPixel Web · 0.2.5</span></div></div>
<div id="library" hidden></div><div id="editor" hidden><div id="pagebar"></div><div id="document-area"><div id="viewport"><div id="canvas-wrap"><canvas id="canvas" aria-label="Холст"></canvas><canvas id="overlay"></canvas></div></div><div id="document-controls"><button data-command="MI_VIEW_ZOOM_OUT">−</button><select id="zoom" aria-label="Масштаб"></select><button data-command="MI_VIEW_ZOOM_IN">+</button><button data-command="MI_VIEW_FIT_WINDOW">По окну</button><span id="image-info"></span></div></div></div></section>
<aside id="right-panel"><section id="layers-panel"><button class="panel-heading" id="layers-heading">⊟ Слои</button><div id="layer-actions"></div><div id="layers" role="listbox" aria-label="Слои" aria-multiselectable="true"></div></section>
<section id="color-panel"><button class="panel-heading" id="color-heading">⊟ Цветоподборщик</button><div id="color-body"><div id="color-top"><button id="foreground" title="Передний цвет"></button><div><button id="swap-colors" title="Поменять цвета">↔</button><button id="default-colors" title="Исходные цвета">▣</button></div><button id="background" title="Фоновый цвет"></button><div><button id="transparent" title="Прозрачный цвет">◩</button><button id="inverted" title="Инвертирующий цвет">◪</button></div></div><div id="color-map-row"><canvas id="color-map" width="192" height="192" aria-label="Карта цвета"></canvas><input id="brightness" type="range" min="0" max="100" value="50" aria-label="Яркость"><button id="toggle-swatches" aria-label="Палитра / HSB" title="Палитра / HSB">▹<br>▹<br>▹</button></div><div id="swatches" hidden></div><div id="channels"></div><div id="color-bottom"><button id="hex-mode">HTML</button><button id="copy-color" title="Копировать цвет">▣</button><input id="hex" aria-label="Код цвета" value="#000000"><button id="color-dialog">sys</button></div><div id="palette-files" hidden><button id="load-palette">Открыть палитру</button><button id="save-palette">Сохранить</button></div></div></section></aside></main>
<footer id="statusbar" role="status">Готово</footer><input type="file" id="file" hidden multiple><input type="file" id="aux-file" hidden><dialog id="dialog"><form method="dialog" id="dialog-form"><header><span id="dialog-title"></span><button type="button" id="dialog-close" aria-label="Закрыть диалог">×</button></header><div id="dialog-body"></div><div id="dialog-buttons"></div></form></dialog><div id="menu-popup" role="menu" hidden></div>
<script type="module" src="assets/7ea4bdf9033e/src/boot.js"></script></body></html>
